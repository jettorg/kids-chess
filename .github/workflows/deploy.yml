name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages 액션이 요구하는 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않도록 한 번에 하나만 실행한다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v7

      - name: Node 준비
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      - name: Pages 설정
        uses: actions/configure-pages@v6
        with:
          # 저장소 설정에서 Pages 를 켜두지 않았어도 워크플로가 직접 활성화한다
          enablement: true

      - name: 결과물 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 에 배포
        id: deployment
        uses: actions/deploy-pages@v5
